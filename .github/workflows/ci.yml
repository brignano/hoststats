name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The format check compares against the PR's base commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Only the files this PR touches, so older drift in untouched files
      # doesn't block anyone — but nothing new adds to it.
      - name: Format (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.mjs' '*.css' '*.json' '*.md' '*.yml' '*.yaml')
          if [ -n "$files" ]; then
            echo "$files" | xargs npx prettier --check --ignore-unknown
          fi

      - name: Typecheck
        run: npm run typecheck

      # Dates are parsed from timezone-less CSV cells, so the stats have to
      # come out the same either side of UTC.
      - name: Test (UTC)
        run: npm test
        env:
          TZ: UTC

      - name: Test (America/New_York)
        run: npm test
        env:
          TZ: America/New_York

      - name: Test (Pacific/Auckland)
        run: npm test
        env:
          TZ: Pacific/Auckland

      - name: Build
        run: npm run build

      # Catches Wrangler config errors (bad assets dir, entry-point mismatch)
      # without needing Cloudflare credentials.
      - name: Validate Cloudflare deploy config
        run: npx wrangler deploy --dry-run

  # The app in a real browser: the landing page, the demo, the demo-to-own-data
  # flow, a stubbed calendar link, and zero axe accessibility violations in
  # both themes at desktop and phone widths.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: Release

on:
  push:
    tags: ["v*"]

# Checkout only. This job creates nothing, so it needs no write scope.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A tag that disagrees with package.json is what makes a releases page
      # start lying, and it is invisible until someone checks. Fail here,
      # before anything is published, rather than leaving a wrong version
      # attached to a real release.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json" \
                 "version ${pkg}. Bump package.json, or delete and re-cut the tag."
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The tagged tree gets the same timezone spread CI runs on main: a
      # release is exactly when a hemisphere-specific date bug would be
      # worst to ship.
      - name: Test (UTC)
        run: npm test
        env:
          TZ: UTC

      - name: Test (America/New_York)
        run: npm test
        env:
          TZ: America/New_York

      - name: Test (Pacific/Auckland)
        run: npm test
        env:
          TZ: Pacific/Auckland

      - name: Build
        run: npm run build

      # This job verifies a release; it does not create one. Releases are cut
      # from the Releases page, and publishing there is what creates the tag —
      # so by the time this runs the release already exists. A `gh release
      # create` here would find it and fail on every single release.
      #
      # Verification is therefore after the fact. It cannot block a bad release,
      # but it does say loudly that one went out, which is the difference
      # between finding out now and finding out from whoever hit the bug.
      - name: Report the result
        run: |
          echo "::notice::${GITHUB_REF_NAME} verified: version matches" \
               "package.json, and lint, typecheck, tests (3 timezones) and" \
               "build all pass against the tagged tree."

name: Release

on:
  push:
    tags: ["v*"]

# Needed to create the release and its tag-associated notes.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A tag that disagrees with package.json is what makes a releases page
      # start lying, and it is invisible until someone checks. Fail here,
      # before anything is published, rather than leaving a wrong version
      # attached to a real release.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json" \
                 "version ${pkg}. Bump package.json, or delete and re-cut the tag."
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The tagged tree gets the same timezone spread CI runs on main: a
      # release is exactly when a hemisphere-specific date bug would be
      # worst to ship.
      - name: Test (UTC)
        run: npm test
        env:
          TZ: UTC

      - name: Test (America/New_York)
        run: npm test
        env:
          TZ: America/New_York

      - name: Test (Pacific/Auckland)
        run: npm test
        env:
          TZ: Pacific/Auckland

      - name: Build
        run: npm run build

      # Prefer the hand-written CHANGELOG section over --generate-notes. A
      # generated list of merged PR titles describes the commits; it does not
      # tell a visitor what the thing does or what changed for them.
      - name: Take the release notes from CHANGELOG.md
        id: notes
        run: |
          # Stop only at the next *version* heading. A plain `^## ` test would
          # end the section at its own first sub-heading.
          awk -v p="## $GITHUB_REF_NAME" '
            $0 == p || index($0, p " ") == 1 { inside = 1; next }
            inside && /^## v[0-9]/ { exit }
            inside { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No '## $GITHUB_REF_NAME' section in CHANGELOG.md;" \
                 "falling back to generated notes."
          fi

      - name: Create the GitHub release
        run: |
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The account ID is not a credential — it appears in every dashboard URL
      # and is useless without a token — so it lives in Variables. Keeping it
      # out of Secrets also stops GitHub masking it as *** in deploy logs,
      # which matters when you are reading Wrangler output to debug a failure.
      - name: Check Cloudflare credentials are configured
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN (secret)"
          [ -z "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing — add under Settings → Secrets and" \
                 "variables → Actions, on the matching tab. See docs/DEPLOYING.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      # Deploy with the Wrangler pinned in package-lock.json rather than
      # wrangler-action's own copy. The action installs an older Wrangler that
      # predates assets-only Workers and rejects a config with no `main`:
      #   ✘ Missing entry-point: The entry-point should be specified via the
      #     command line ... or the `main` config field.
      # HostStats has no Worker script — it is purely static assets.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
